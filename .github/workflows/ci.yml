name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Package.swiftのswift-tools-version 6.4はXcode 27のSwiftを要する．
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaksでcommit済みの履歴全体を調べる．
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      # flakeを評価すると約90秒かかるため，ビルド済みのdevenvをstore pathで取得する．
      # 版を上げるときは `nix eval --raw github:cachix/devenv/<tag>#packages.aarch64-darwin.default.outPath` で取り直す．
      - name: Install devenv
        env:
          DEVENV: /nix/store/kaxp0ycbmay6wypy1fqly1c35dvf0ly8-devenv-wrapped-2.4.0
        run: |
          nix-store --realise "$DEVENV"
          echo "$DEVENV/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          devenv --version
          xcodebuild -version
          swift --version
      - name: Check public content
        run: python3 scripts/check-public-content.py
      # 全ファイルにcommit前hookを実行してから，devenv.nixのenterTestでビルドとテストを行う．
      - name: Lint and test
        run: devenv test
      - name: Web administration page interactions
        run: devenv shell -- env PLINTH_NATIVE_TESTS=1 swift test --filter WebAdministrationPageInteractionTests -Xswiftc -warnings-as-errors
      # commit前hookのgitleaksはstageした変更だけを見るため，CIでは履歴を調べる．
      - name: Scan secrets
        run: devenv shell -- just secrets

  # iOSのビルドはNixを使わないため，devenvを用意せずcheckと並べて動かす．
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # devenv.lockで固定したjustと同じ版を使う．
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - name: Build iOS app
        run: just build-ios

  mac-store-ui:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show display modes
        run: >-
          swift -e 'import CoreGraphics; let display = CGMainDisplayID();
          print("current", CGDisplayPixelsWide(display), CGDisplayPixelsHigh(display));
          if let modes = CGDisplayCopyAllDisplayModes(display, nil) as? [CGDisplayMode] {
          print(modes.map { "\($0.width)x\($0.height)" }.joined(separator: ",")) }'
      - name: Test Mac store screens
        run: |
          python3 scripts/create-xcode-project.py --enable-ui-tests
          xcodebuild -quiet -project Plinth.xcodeproj -scheme Plinth \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/mac-store-ui \
            -resultBundlePath .build/mac-store-ui.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -only-testing:KioskUITests/KioskWorkflowUITests/testInformationPagesLicensesAndStoreScreenshots \
            test
      - name: Export screenshots
        if: always()
        run: |
          if test -f .build/mac-store-ui.xcresult/Info.plist; then
            xcrun xcresulttool export attachments \
              --path .build/mac-store-ui.xcresult \
              --output-path .build/mac-store-ui-attachments
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac-store-ui-attachments
          path: .build/mac-store-ui-attachments
          if-no-files-found: warn
