<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=3960, initial-scale=1">
<title>Plinth App Store iPhone screenshots</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 3960px; height: 2868px; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #10283b; }
  .strip { position: relative; display: grid; grid-template-columns: repeat(3, 1320px); width: 3960px; height: 2868px; overflow: hidden; background: #f2f0e9; }
  .strip::before { content: ""; position: absolute; inset: 0; background: url('../screenshot-concepts/flux-wide.png') center 59% / auto 2780px no-repeat; opacity: .42; }
  .strip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #f2f0e9 0%, #f2f0e9f5 23%, #f2f0e955 56%, #102b3de8 100%); pointer-events: none; }
  .panel { position: relative; z-index: 1; overflow: hidden; border-right: 3px solid #ffffffa8; }
  .panel:last-child { border-right: 0; }
  .index { position: absolute; top: 107px; left: 99px; font-size: 42px; font-weight: 760; letter-spacing: .17em; }
  h1 { position: absolute; top: 282px; left: 99px; right: 65px; margin: 0; font-size: 137px; line-height: 1.04; letter-spacing: -.062em; font-weight: 760; }
  .phone { position: absolute; left: 186px; top: 750px; width: 948px; height: 2059px; overflow: hidden; border: 20px solid #102b40; border-radius: 105px; background: #102b40; box-shadow: 0 74px 150px #09263870; }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .panel.settings .phone { top: 780px; }
</style>
<div class="strip">
  <section class="panel"><div class="index">PLINTH / 01</div><h1 data-headline="0">Make the web<br>an exhibition.</h1><div class="phone"><img src="source-flux-app.png" alt="Plinth showing Flux"></div></section>
  <section class="panel settings"><div class="index">PLINTH / 02</div><h1 data-headline="1">Set allowed<br>sites.</h1><div class="phone"><img id="settings-image" src="source-settings-en-app.png" alt="Plinth settings"></div></section>
  <section class="panel"><div class="index">PLINTH / 03</div><h1 data-headline="2">Switch<br>exhibits.</h1><div class="phone"><img src="source-drift-app.png" alt="Plinth showing Drift"></div></section>
</div>
<script>
  const variants = {
    en: {
      headlines: ['Make the web<br>an exhibition.', 'Set allowed<br>sites.', 'Switch<br>exhibits.'],
      settings: 'source-settings-en-app.png',
    },
    ja: {
      headlines: ['Webを<br>展示に。', '閲覧先を<br>設定。', '作品を<br>切り替える。'],
      settings: '../../screenshots/ios-ja-iphone69-settings.png',
    },
    ko: {
      headlines: ['웹을<br>전시로.', '허용 사이트를<br>설정하세요.', '전시 작품을<br>바꾸세요.'],
      settings: '../../screenshots/ios-ko-iphone69-settings.png',
    },
    'zh-Hans': {
      headlines: ['让网页<br>成为展览。', '设置<br>可访问的网站。', '切换<br>展出作品。'],
      settings: '../../screenshots/ios-zh-Hans-iphone69-settings.png',
    },
  };
  const locale = new URLSearchParams(location.search).get('lang') || 'en';
  const variant = variants[locale] || variants.en;
  document.documentElement.lang = locale;
  document.querySelectorAll('[data-headline]').forEach((node, index) => { node.innerHTML = variant.headlines[index]; });
  document.getElementById('settings-image').src = variant.settings;
</script>
</html>
